name: "🐛 Reporte de Bug"
description: "Reporta un error o comportamiento inesperado en StaffCore"
title: "[BUG] "
labels: ["bug", "necesita-revisión"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Gracias por reportar un bug
        Por favor completa el formulario con la mayor cantidad de detalles posible. Esto nos ayuda a reproducir y solucionar el problema más rápido.

  - type: checkboxes
    id: pre-checks
    attributes:
      label: "✅ Antes de reportar"
      description: "Asegúrate de haber hecho lo siguiente:"
      options:
        - label: "Busqué en los issues existentes y no encontré uno igual"
          required: true
        - label: "Estoy usando la versión más reciente de StaffCore"
          required: true
        - label: "Leí la documentación del plugin"
          required: false

  - type: input
    id: staffcore-version
    attributes:
      label: "📦 Versión de StaffCore"
      description: "Usa /staff version para ver la versión"
      placeholder: "Ej: 1.3.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: "🖥️ Versión del servidor"
      description: "Paper, Spigot, etc."
      placeholder: "Ej: Paper 1.21.1 (build 92)"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: "☕ Versión de Java"
      placeholder: "Ej: Java 21"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "📝 Descripción del bug"
      description: "Describe claramente qué está pasando"
      placeholder: "Cuando hago X, ocurre Y en lugar de Z..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "🔁 Pasos para reproducir"
      description: "Lista los pasos exactos para reproducir el bug"
      placeholder: |
        1. Entrar al modo staff con /sc
        2. Hacer clic en el item X
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Comportamiento esperado"
      placeholder: "Qué debería pasar normalmente..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Comportamiento actual"
      placeholder: "Qué está pasando realmente..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📋 Logs / Errores de consola"
      description: "Pega cualquier error de la consola aquí (en bloque de código)"
      render: shell
      placeholder: "Pega los logs aquí..."
    validations:
      required: false

  - type: textarea
    id: plugins
    attributes:
      label: "🔌 Plugins instalados"
      description: "Lista los plugins instalados en tu servidor"
      placeholder: "Ej: EssentialsX, LuckPerms, Vault..."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "➕ Información adicional"
      description: "Capturas de pantalla, videos, cualquier cosa extra que ayude"
    validations:
      required: false