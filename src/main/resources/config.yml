staff-tools:
  # Anti-double-click / anti-duplicate packet cooldown for tool actions (ms)
  action-cooldown-ms: 300
  # Tool names/lore are language-specific in lang/*.yml (messages.staff-tool-*)
  # Behavior values stay here.
  teleporter:
    # Also used for line-of-sight target search
    max-distance: 120

moderation:
  # Hierarchy safeguards for punishments/reports
  protect-enabled: true
  protect-permission: staffcore.protect
  override-permission: staffcore.override
  # Additional override to allow moderating other staff members.
  # Without this, staff cannot freeze/punish each other.
  staff-target-override-permission: staffcore.stafftarget.override

  # Links shown in ban/kick screen templates (lang files can use {appeal} and {store}).
  links:
    appeal-url: 'https://tu-servidor.com/apelaciones'
    store-url: 'https://tu-servidor.com/tienda'

  # Global limits for moderation text
  min-reason-length: 4
  max-note-length: 220

  # ==========================================================
  # SANCTION REASON RULES
  # ----------------------------------------------------------
  # Since this version, sanctions store a CLEAN reason only
  # (example: "Hacks", "Spam", "Insults") to avoid giant duplicated texts.
  #
  # IMPORTANT:
  # Final visual templates for players/staff are configured in lang/*.yml.
  # These keys remain for compatibility and should usually stay as "{reason}".
  # ==========================================================
  reason-templates:
    warn: '{reason}'
    mute: '{reason}'
    kick: '{reason}'
    ban: '{reason}'
    tempban: '{reason}'

# Language files now own all visible chat/title text.
# Edit /plugins/StaffCore/lang/*.yml to customize messages.
