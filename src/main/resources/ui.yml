welcome:
  # First join onboarding text/sound/title
  first-join-title: '&bWelcome'
  first-join-subtitle: '&7Enjoy your experience on the server'
  first-join-lines:
    - '&aWelcome, {player}.'
    - '&7We hope you enjoy and play fair.'

staff-hud:
  # Available Placeholders:
  #  {tps}             - Server TPS (e.g. 20.00)
  #  {ping}            - Staff Ping in milliseconds (e.g. 24)
  #  {reports}         - Number of active open reports
  #  {staff_online}    - Number of online staff members
  #  {online}          - Total online players on the server
  #  {max}             - Maximum server slots
  #  {world}           - Current world name
  #  {cps}             - Current left clicks per second
  #  {duty_time}       - Duration of active /staffduty session (e.g. 15m 20s)
  #  {duty_status}     - Status indicator (ON DUTY / OFF DUTY)
  #  {vanish}          - Vanish state text (ON / OFF)
  #  {vanish_icon}     - Vanish state icon (✔ / ✖)
  #  {player}          - Name of the staff player
  format: '&8[&bTPS&8] &f{tps}  &8[&aPING&8] &f{ping}ms  &8[&dVANISH&8] {vanish_icon}'
  vanish-on-text: '&aON'
  vanish-off-text: '&cOFF'
  vanish-on-icon: '&a&l✔'
  vanish-off-icon: '&c&l✖'
  bossbar:
    # BossBar title format (supports RGB colors, gradient tags & legacy codes)
    format: '&b&lSTAFF &8| &7TPS: &a{tps} &8| &7Ping: &e{ping}ms &8| &7Reports: &c{reports} &8| &7Staff: &b{staff_online} &8| &7Vanish: {vanish_icon}'

staff-chat:
  # Format for @message staff chat
  # Placeholders: {player} {message}
  format: '&8[&3&lSTAFF-CHAT&8] &b{player}&8: &f{message}'

helpop:
  # Visual template sent to staff and console.
  # Placeholders: {player} {message} {message_raw} {message_wrapped} {message_compact} {time} {server}
  template-lines:
    - '&8&m========================================'
    - '&c&l[HELPOP] NEW REQUEST'
    - '&7Player: &f{player} &8| &7Time: &f{time}'
    - '&7Server: &f{server}'
    - '&7Message:'
    - '&f{message_compact}'
    - '&8&m========================================'
  # Title text for online staff alert
  alert-title: '&c&l[HELPOP]'
  alert-subtitle: '&f{player} &7needs staff assistance'

staff-tools:
  # Names/lore of staff mode toolbar items
  teleporter:
    name: '&bTeleporter'
    lore: '&7Right click a player to teleport.'
  freeze:
    name: '&bFreeze'
    lore: '&7Right click a player to freeze.'
  inspector:
    name: '&bInspector'
    lore: '&7Right click to inspect inventory.'
  spectator:
    name: '&bSpectator Mode'
    lore: '&7Right click to toggle spectator.'
  panel:
    name: '&bStaff Panel'
    lore: '&7Open main moderation panel.'
  night-vision:
    name: '&bNight Vision'
    lore: '&7Right click to toggle night vision.'
  vanish:
    lore: '&7Toggle your visibility.'
  vanish-on:
    name: '&aVanish: ON'
  vanish-off:
    name: '&cVanish: OFF'
  exit:
    name: '&cExit Staff'
    lore: '&7Safely return to normal state.'
