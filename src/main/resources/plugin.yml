name: StaffCore
version: 1.3.0
main: com.tuservidor.staffcore.StaffCore
api-version: '1.21'
author: Dafealru
description: StaffCore | Modern Moderation Suite

commands:
  staff:
    description: Toggle staff mode or reload StaffCore.
    usage: /staff [on|off|menu|speed|flyspeed|reload|health|cleanfreeze|help]
    aliases: [mod, staffmode]
  staffpanel:
    description: Open the staff panel.
    usage: /staffpanel
    aliases: [spanel, smenu]
    permission: staffcore.staff
  vanish:
    description: Toggle vanish mode.
    usage: /vanish
    aliases: [v]
    permission: staffcore.vanish
  freeze:
    description: Freeze or unfreeze a player.
    usage: /freeze <player> <reason> | /freeze <player> | /freeze claim <player>
    permission: staffcore.freeze
  staffchat:
    description: Send a private message to staff.
    usage: /staffchat <on|off|message>
    aliases: [sc]
    permission: staffcore.staffchat
  chatmute:
    description: Mute or unmute global chat.
    usage: /chatmute [on|off|toggle|status]
    aliases: [mutechat, chatsilence]
    permission: staffcore.chatmute
  helpop:
    description: Send a help request to online staff.
    usage: /helpop <message>
    permission: staffcore.helpop
  report:
    description: Report a player to online staff.
    usage: /report <player> <reason>
    permission: staffcore.report
  reports:
    description: View and close reports.
    usage: /reports [close <id>]
    permission: staffcore.reports.view
  notes:
    description: Manage internal staff notes.
    usage: /notes <player> <list|add|remove> [text|id]
    permission: staffcore.notes
  warn:
    description: Warn a player.
    usage: /warn <player> <reason>
    permission: staffcore.punish.warn
  mute:
    description: Mute a player.
    usage: /mute <player> <duration|perm> <reason>
    permission: staffcore.punish.mute
  unmute:
    description: Unmute a player.
    usage: /unmute <player>
    permission: staffcore.punish.unmute
  sckick:
    description: Kick a player.
    usage: /sckick <player> <reason>
    permission: staffcore.punish.kick
  scban:
    description: Permanently ban a player.
    usage: /scban <player> <reason>
    permission: staffcore.punish.ban
  scbanip:
    description: Permanently IP ban a player or IP address.
    usage: /scbanip <player|ip> <reason>
    permission: staffcore.punish.banip
  sctempban:
    description: Temporarily ban a player.
    usage: /sctempban <player> <duration> <reason>
    permission: staffcore.punish.tempban
  sctempbanip:
    description: Temporarily IP ban a player or IP address.
    usage: /sctempbanip <player|ip> <duration> <reason>
    permission: staffcore.punish.tempbanip
  scunban:
    description: Unban a player.
    usage: /scunban <player>
    permission: staffcore.punish.unban
  scunbanip:
    description: Unban an IP address or player IP.
    usage: /scunbanip <player|ip>
    permission: staffcore.punish.unbanip
  history:
    description: View full moderation history of a player.
    usage: /history <player>
    permission: staffcore.history
  stafflogs:
    description: View moderation logs.
    usage: /stafflogs [player|clear]
    permission: staffcore.logs
  stafflang:
    description: Change your plugin language.
    usage: /stafflang <en|es|fr|pt>
    permission: staffcore.lang
  xrayalerts:
    description: Manage X-Ray alerts and staff alert visibility.
    usage: /xrayalerts [on|off|toggle|module <on|off>|stats <player>]
    aliases: [xalerts]
    permission: staffcore.xray.alerts

permissions:
  staffcore.admin:
    default: op
    children:
      staffcore.staff: true
      staffcore.vanish: true
      staffcore.vanish.see: true
      staffcore.freeze: true
      staffcore.freeze.bypass: true
      staffcore.staffchat: true
      staffcore.chatmute: true
      staffcore.chatmute.bypass: true
      staffcore.helpop: true
      staffcore.helpop.receive: true
      staffcore.reports.view: true
      staffcore.reload: true
      staffcore.report: true
      staffcore.use: true
      staffcore.notes: true
      staffcore.history: true
      staffcore.logs: true
      staffcore.logs.clear: true
      staffcore.punish.warn: true
      staffcore.punish.mute: true
      staffcore.punish.unmute: true
      staffcore.punish.kick: true
      staffcore.punish.ban: true
      staffcore.punish.banip: true
      staffcore.punish.tempban: true
      staffcore.punish.tempbanip: true
      staffcore.punish.unban: true
      staffcore.punish.unbanip: true
      staffcore.lang: true
      staffcore.override: true
      staffcore.stafftarget.override: true
      staffcore.xray.alerts: true
      staffcore.xray.bypass: true
      staffcore.speed: true
      staffcore.update: true
  staffcore.staff:
    default: op
  staffcore.vanish:
    default: op
  staffcore.vanish.see:
    default: op
  staffcore.freeze:
    default: op
  staffcore.freeze.bypass:
    default: op
  staffcore.staffchat:
    default: op
  staffcore.chatmute:
    default: op
  staffcore.chatmute.bypass:
    default: op
  staffcore.helpop:
    default: true
  staffcore.helpop.receive:
    default: op
  staffcore.reports.view:
    default: op
  staffcore.reload:
    default: op
  staffcore.report:
    default: true
  staffcore.use:
    default: op
  staffcore.notes:
    default: op
  staffcore.history:
    default: op
  staffcore.logs:
    default: op
  staffcore.logs.clear:
    default: op
  staffcore.punish.warn:
    default: op
  staffcore.punish.mute:
    default: op
  staffcore.punish.unmute:
    default: op
  staffcore.punish.kick:
    default: op
  staffcore.punish.ban:
    default: op
  staffcore.punish.banip:
    default: op
  staffcore.punish.tempban:
    default: op
  staffcore.punish.tempbanip:
    default: op
  staffcore.punish.unban:
    default: op
  staffcore.punish.unbanip:
    default: op
  staffcore.lang:
    default: op
  staffcore.override:
    default: op
  staffcore.stafftarget.override:
    default: op
  staffcore.protect:
    default: false
  staffcore.xray.alerts:
    default: op
  staffcore.xray.bypass:
    default: op
  staffcore.speed:
    default: op
  staffcore.update:
    default: op


