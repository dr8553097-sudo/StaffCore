name: StaffCore
version: 2.0.0
main: com.tuservidor.staffcore.StaffCore
api-version: '1.21'
author: Dafealru
description: StaffCore | Modern Moderation Suite
softdepend:
  - LuckPerms

commands:
  staffduty:
    description: Toggle on-duty staff status and moderation timer.
    usage: /staffduty
    aliases: [duty, sduty]
    permission: staffcore.staff
  stafftop:
    description: View the top active staff members leaderboard.
    usage: /stafftop
    aliases: [topstaff, stop]
    permission: staffcore.staff
  staff:
    description: Toggle staff mode or reload StaffCore.
    usage: /staff [on|off|menu|speed|flyspeed|reload|health|cleanfreeze|help]
    aliases: [mod, staffmode]
  staffpanel:
    description: Open the staff panel.
    usage: /staffpanel
    aliases: [spanel, smenu]
    permission: staffcore.staff
  vanish:
    description: Toggle vanish mode.
    usage: /vanish
    aliases: [v]
    permission: staffcore.vanish
  freeze:
    description: Freeze or unfreeze a player.
    usage: /freeze <player> <reason> | /freeze <player> | /freeze claim <player>
    permission: staffcore.freeze
  staffchat:
    description: Send a private message to staff.
    usage: /staffchat <on|off|message>
    aliases: [sc]
    permission: staffcore.staffchat
  chatmute:
    description: Mute or unmute global chat.
    usage: /chatmute [on|off|toggle|status]
    aliases: [mutechat, chatsilence]
    permission: staffcore.chatmute
  helpop:
    description: Send a help request to online staff.
    usage: /helpop <message>
    permission: staffcore.helpop
  report:
    description: Report a player to online staff.
    usage: /report <player> <reason>
    permission: staffcore.report
  reports:
    description: View and close reports.
    usage: /reports [close <id>]
    permission: staffcore.reports.view
  notes:
    description: Manage internal staff notes.
    usage: /notes <player> <list|add|remove> [text|id]
    permission: staffcore.notes
  stafflogs:
    description: View moderation logs.
    usage: /stafflogs [player|clear]
    permission: staffcore.logs
  stafflang:
    description: Change your plugin language.
    usage: /stafflang <en|es|fr|pt>
    permission: staffcore.lang
  xrayalerts:
    description: Manage X-Ray alerts and staff alert visibility.
    usage: /xrayalerts [on|off|toggle|module <on|off>|stats <player>]
    aliases: [xalerts]
    permission: staffcore.xray.alerts

permissions:
  staffcore.admin:
    default: op
    children:
      staffcore.staff: true
      staffcore.vanish: true
      staffcore.vanish.see: true
      staffcore.freeze: true
      staffcore.freeze.bypass: true
      staffcore.staffchat: true
      staffcore.chatmute: true
      staffcore.chatmute.bypass: true
      staffcore.helpop: true
      staffcore.helpop.receive: true
      staffcore.reports.view: true
      staffcore.reload: true
      staffcore.report: true
      staffcore.use: true
      staffcore.notes: true
      staffcore.logs: true
      staffcore.logs.clear: true
      staffcore.lang: true
      staffcore.override: true
      staffcore.stafftarget.override: true
      staffcore.xray.alerts: true
      staffcore.xray.bypass: true
      staffcore.speed: true
      staffcore.update: true
  staffcore.staff:
    default: op
  staffcore.vanish:
    default: op
  staffcore.vanish.see:
    default: op
  staffcore.freeze:
    default: op
  staffcore.freeze.bypass:
    default: op
  staffcore.staffchat:
    default: op
  staffcore.chatmute:
    default: op
  staffcore.chatmute.bypass:
    default: op
  staffcore.helpop:
    default: true
  staffcore.helpop.receive:
    default: op
  staffcore.reports.view:
    default: op
  staffcore.reload:
    default: op
  staffcore.report:
    default: true
  staffcore.use:
    default: op
  staffcore.notes:
    default: op
  staffcore.logs:
    default: op
  staffcore.logs.clear:
    default: op
  staffcore.lang:
    default: op
  staffcore.override:
    default: op
  staffcore.stafftarget.override:
    default: op
  staffcore.protect:
    default: false
  staffcore.xray.alerts:
    default: op
  staffcore.xray.bypass:
    default: op
  staffcore.speed:
    default: op
  staffcore.update:
    default: op



